<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b47f5">
  <meta name="description" content="Compra y vende dentro de tu universidad.">
  <title>CampusMarket</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="demo-banner" class="demo-banner" hidden>
    <strong>Modo demo</strong> · Los datos se guardan solo en este navegador. Conecta Firebase en <code>js/config.js</code>.
  </div>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="logo"><span class="logo-mark">🛍️</span><span class="logo-text" data-appname>CampusMarket</span></a>
      <nav class="top-links">
        <a href="#/" data-nav="home">Explorar</a>
        <a href="#/panel/compras" data-nav="compras">Mis compras</a>
        <a href="#/panel" data-nav="panel">Mi panel <span class="badge" data-badge hidden></span></a>
      </nav>
      <a href="#/vender" class="btn btn-primary btn-sm hide-mobile" data-icon="plus">Vender</a>
      <div id="account" class="account"></div>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1">
    <div class="page-loader"><span class="spinner"></span></div>
  </main>

  <nav class="bottomnav" aria-label="Navegación principal">
    <a href="#/" data-nav="home" data-icon="home"><span>Inicio</span></a>
    <a href="#/panel/compras" data-nav="compras" data-icon="bag"><span>Compras</span></a>
    <a href="#/vender" data-nav="vender" class="fab" aria-label="Vender" data-icon="plus"></a>
    <a href="#/panel" data-nav="panel" data-icon="grid"><span>Panel</span><span class="badge" data-badge hidden></span></a>
    <button type="button" id="nav-account" data-nav="cuenta" data-icon="user"><span>Cuenta</span></button>
  </nav>

  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- Firebase (versión compat: funciona con <script> normales, sin módulos ni build) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
